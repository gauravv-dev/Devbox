<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background: deep cosmic indigo -> violet -> rose -->
    <radialGradient id="bgRad" cx="38%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#5B3FD6"/>
      <stop offset="42%" stop-color="#3A1E96"/>
      <stop offset="78%" stop-color="#241359"/>
      <stop offset="100%" stop-color="#150A33"/>
    </radialGradient>
    <linearGradient id="bgDiag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#4C1D95" stop-opacity="0"/>
      <stop offset="100%" stop-color="#BE185D" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Emblem stroke gradient: cyan -> violet -> pink -->
    <linearGradient id="emblemStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="45%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Gem facet fill -->
    <radialGradient id="facetFill" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#6D28D9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="sparkFill" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <!-- Glow filters -->
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Squircle clip -->
    <clipPath id="tile"><path d="M0,229
    C0,126.47670000000001 126.47670000000001,0 229,0
    L795,0
    C897.5233,0 1024,126.47670000000001 1024,229
    L1024,795
    C1024,897.5233 897.5233,1024 795,1024
    L229,1024
    C126.47670000000001,1024 0,897.5233 0,795
    Z"/></clipPath>
    <!-- Top gloss -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="34%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Inner vignette -->
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#tile)">
    <!-- base -->
    <rect width="1024" height="1024" fill="url(#bgRad)"/>
    <rect width="1024" height="1024" fill="url(#bgDiag)"/>

    <!-- gem facets behind emblem for dimension -->
    <g opacity="0.9"><polygon fill="url(#facetFill)" points="512,512 512.0,265.0 725.9,388.5"/><polygon fill="url(#facetFill)" points="512,512 725.9,388.5 725.9,635.5"/><polygon fill="url(#facetFill)" points="512,512 725.9,635.5 512.0,759.0"/><polygon fill="url(#facetFill)" points="512,512 512.0,759.0 298.1,635.5"/><polygon fill="url(#facetFill)" points="512,512 298.1,635.5 298.1,388.5"/><polygon fill="url(#facetFill)" points="512,512 298.1,388.5 512.0,265.0"/></g>

    <!-- guide rings -->
    <g fill="none" stroke="#C4B5FD" stroke-opacity="0.16" stroke-width="1.5"><circle cx="512" cy="512" r="244"/><circle cx="512" cy="512" r="266"/></g>

    <!-- hexagon frame -->
    <path d="M512.00,262.00L728.51,387.00L728.51,637.00L512.00,762.00L295.49,637.00L295.49,387.00Z" fill="none" stroke="url(#emblemStroke)" stroke-width="5" stroke-opacity="0.9" filter="url(#softGlow)"/>
    <path d="M512.00,268.00L723.31,390.00L723.31,634.00L512.00,756.00L300.69,634.00L300.69,390.00Z" fill="none" stroke="#E0E7FF" stroke-opacity="0.18" stroke-width="1"/>

    <!-- Flower of Life -->
    <g fill="none" stroke="url(#emblemStroke)" stroke-width="3" stroke-opacity="0.92" filter="url(#softGlow)"><circle cx="512.00" cy="512.00" r="118"/><circle cx="512.00" cy="394.00" r="118"/><circle cx="614.19" cy="453.00" r="118"/><circle cx="614.19" cy="571.00" r="118"/><circle cx="512.00" cy="630.00" r="118"/><circle cx="409.81" cy="571.00" r="118"/><circle cx="409.81" cy="453.00" r="118"/><circle cx="614.19" cy="335.00" r="118"/><circle cx="716.38" cy="512.00" r="118"/><circle cx="614.19" cy="689.00" r="118"/><circle cx="409.81" cy="689.00" r="118"/><circle cx="307.62" cy="512.00" r="118"/><circle cx="409.81" cy="335.00" r="118"/><circle cx="512.00" cy="276.00" r="118"/><circle cx="716.38" cy="394.00" r="118"/><circle cx="716.38" cy="630.00" r="118"/><circle cx="512.00" cy="748.00" r="118"/><circle cx="307.62" cy="630.00" r="118"/><circle cx="307.62" cy="394.00" r="118"/></g>
    <!-- second pass: crisp inner lines without blur for definition -->
    <g fill="none" stroke="url(#emblemStroke)" stroke-width="2" stroke-opacity="0.95"><circle cx="512.00" cy="512.00" r="118"/><circle cx="512.00" cy="394.00" r="118"/><circle cx="614.19" cy="453.00" r="118"/><circle cx="614.19" cy="571.00" r="118"/><circle cx="512.00" cy="630.00" r="118"/><circle cx="409.81" cy="571.00" r="118"/><circle cx="409.81" cy="453.00" r="118"/><circle cx="614.19" cy="335.00" r="118"/><circle cx="716.38" cy="512.00" r="118"/><circle cx="614.19" cy="689.00" r="118"/><circle cx="409.81" cy="689.00" r="118"/><circle cx="307.62" cy="512.00" r="118"/><circle cx="409.81" cy="335.00" r="118"/><circle cx="512.00" cy="276.00" r="118"/><circle cx="716.38" cy="394.00" r="118"/><circle cx="716.38" cy="630.00" r="118"/><circle cx="512.00" cy="748.00" r="118"/><circle cx="307.62" cy="630.00" r="118"/><circle cx="307.62" cy="394.00" r="118"/></g>

    <!-- central diamond spark -->
    <path d="M512,486 L538,512 L512,538 L486,512 Z" fill="url(#sparkFill)" opacity="0.9" filter="url(#sparkGlow)"/>
    <path d="M512,486 L538,512 L512,538 L486,512 Z" fill="url(#sparkFill)"/>

    <!-- vignette + gloss -->
    <rect width="1024" height="1024" fill="url(#vig)"/>
    <rect width="1024" height="512" fill="url(#gloss)"/>
  </g>

  <!-- subtle outer border to define the tile edge -->
  <path d="M0,229
    C0,126.47670000000001 126.47670000000001,0 229,0
    L795,0
    C897.5233,0 1024,126.47670000000001 1024,229
    L1024,795
    C1024,897.5233 897.5233,1024 795,1024
    L229,1024
    C126.47670000000001,1024 0,897.5233 0,795
    Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
</svg>